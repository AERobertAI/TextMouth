name: TextMouth
options:
  bundleIdPrefix: com.textmouth
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: "0.9.19"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.5"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: "0.5.0"

targets:
  TextMouth:
    type: application
    platform: macOS
    sources:
      - TextMouth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouth
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: TextMouth/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TextMouth/Resources/TextMouth.entitlements
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: TextMouth
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
      - package: swift-markdown
        product: Markdown
