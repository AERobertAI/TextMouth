      - TextMouthProductionTests/TitleTypingTests.swift
      - TextMouthProductionTests/UnicodeCoordinateTests.swift
      - TextMouthProductionTests/ViewsAndWindowsCloudStatesTests.swift
      - TextMouthProductionTests/WordDocumentComparisonTests.swift
      - TextMouthProductionTests/WordDocumentLegacyComparisonTests.swift
      - TextMouthProductionTests/XMLInputGuardTests.swift
      - TextMouthProductionTests/ZIPTestSupport.swift
      # End of the shared Mac test files.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthiOSTests
        GENERATE_INFOPLIST_FILE: true
        # Both apps' products are TextMouth.app, and the scheme Xcode made for
        # the iPhone app by itself left this bundle out of its tests: the
        # iPhone app's own scheme, in the TextMouthiOS target, names it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TextMouth.app/TextMouth"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The LAME, exception-catcher, braille-protocol, and FFmpeg-stream modules, which `@testable import TextMouth` may load.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/ObjCExceptionCatcher/include $(SRCROOT)/TextMouthBraille/include $(SRCROOT)/TextMouthFFmpeg/include
    dependencies:
      - target: TextMouthiOS
  # The iPhone app driven from outside, in the simulator, by XCUITest: what
  # VoiceOver would be given on the Library and the reader (each element's
  # label, value, and traits, and their order), and Apple's accessibility
  # audit of each screen. Each test launches the app with a library of its
  # own and a public-domain book sent to it (PhoneLaunchRequest). A test that
  # presses Play or types makes sound, so it runs only where
  # TEXTMOUTH_UI_SOUND is 1, which the GitHub runner's script sets and nothing
  # on the development Mac does (TextMouthUITestCase.requireSound).
  TextMouthiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TextMouthiOSUITests
      # Alice's Adventures in Wonderland, Project Gutenberg #11, the sample
      # the Mac's tests read too: the book each UI test sends the app.
      - path: TestData/alice.epub
        buildPhase: resources
      # The Grade 2 braille sample the Mac's tests read too, which
      # BrailleUITests sends the app (DR34).
      - path: TestData/format-samples/brf/grade2-short.brf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthiOSUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TextMouthiOS
    dependencies:
      - target: TextMouthiOS
