name: TextMouth
options:
  bundleIdPrefix: com.textmouth
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

# Swift package versions are locked deliberately. Each direct dependency is
# an exactVersion requirement, so regenerating the project can never float to
# an untested release, and the committed Package.resolved under
# TextMouth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/ pins exact
# revisions plus the transitive swift-cmark package. `make check` fails when
# resolution would change that file. To upgrade a package, change its version
# here, run `make update-packages`, review the Package.resolved diff, run
# `make check`, and commit both files together.
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: "2.13.9"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: "0.9.0"

# Every target compiles in the Swift 6 language mode and checks Swift
# concurrency completely, so Xcode, make build, make test, make check, and CI
# all report the same diagnostics. Both are set here, for the whole project,
# overriding XcodeGen's Swift 5 default, so a target added later inherits
# them too; no target may lower them. In the Swift 6 mode a data race the
# compiler can find is an error rather than a warning, and synchronous
# main-actor code that a framework calls on another thread stops at a runtime
# check instead of racing. SWIFT_STRICT_CONCURRENCY repeats what the Swift 6
# mode implies, and stays as the setting the build commands and documentation
# name. The build is free of warnings, and `make check` fails on any Swift
# warning (Scripts/check.sh), so a new concurrency problem is reported the
# day it is written. Package targets are not affected: Xcode builds them with
# their own settings and suppresses their warnings.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

# The version both apps carry, on one line: Scripts/set-version.sh (make
# set-version, bump-patch, and bump-minor) changes exactly one
# MARKETING_VERSION line, and the Mac app and the iOS app share it.
settingGroups:
  appVersion:
    MARKETING_VERSION: "0.4.6"
    CURRENT_PROJECT_VERSION: "1"

# The two C libraries both apps link, each defined once and built for each
# platform by a target of its own (LAME and LAME_iOS, ObjCExceptionCatcher
# and ObjCExceptionCatcher_iOS): see the targets below for what each is.
targetTemplates:
  LAMELibrary:
    type: library.static
    # LAME is C alone, with no Objective-C class or category for the linker
    # to keep, so the app links it without the -ObjC flag XcodeGen otherwise
    # adds to every target that links a static library.
    requiresObjCLinking: false
    sources:
      - path: Vendor/lame/libmp3lame
        headerVisibility: project
      - path: Vendor/lame/config.h
        headerVisibility: project
    settings:
      base:
        PRODUCT_NAME: mp3lame
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/lame
          - $(SRCROOT)/Vendor/lame/include
          - $(SRCROOT)/Vendor/lame/libmp3lame
        GCC_PREPROCESSOR_DEFINITIONS: HAVE_CONFIG_H=1
        GCC_OPTIMIZATION_LEVEL: s
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
        # LAME and liblouis each include their own "config.h". Xcode's header
        # map lists every header of the project under its bare name, so it
        # can hand either target the other's; without it, each target finds
        # its own through its search paths above.
        USE_HEADERMAP: NO
  ObjCExceptionCatcherLibrary:
    type: library.static
    requiresObjCLinking: false
    sources:
      - path: Vendor/ObjCExceptionCatcher/ObjCExceptionCatcher.m
      - path: Vendor/ObjCExceptionCatcher/include/ObjCExceptionCatcher.h
        headerVisibility: project
    settings:
      base:
        PRODUCT_NAME: ObjCExceptionCatcher
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/ObjCExceptionCatcher/include
        CLANG_ENABLE_OBJC_ARC: YES
        SKIP_INSTALL: YES

targets:
  TextMouth:
    type: application
    platform: macOS
    sources:
      # Every source file, less the iOS app's own folder: a new file is
      # shared by both apps unless it is in TextMouth/Platform/iOS/ (iOS
      # only) or TextMouth/Platform/macOS/ (the Mac only, which the iOS
      # target leaves out). Scripts/ios/typecheck.py follows the same rule.
      - path: TextMouth
        excludes:
          - "Platform/iOS/**"
      # liblouis's braille tables (FMT21), copied unchanged as one folder
      # into Contents/Resources/liblouis/tables, where the braille helper
      # finds them (see the liblouis target below).
      - path: Vendor/liblouis/tables
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
            subpath: liblouis
      # The licences of the code TextMouth bundles, copied unchanged from the
      # vendored files into Contents/Resources/Licenses, one folder for each:
      # liblouis (FMT21) is under the GNU Lesser General Public License 2.1,
      # LAME (FR04) under the GNU Library General Public License 2, and
      # foliate-js (MIT), whose mobi.js the MOBI reader (FMT42) follows, under
      # its own MIT licence. They are copied from Vendor, never into the
      # repository a second time, so each stays the vendored release's own
      # text. BundledLicenseTests checks that every one reaches the built app.
      - path: Vendor/liblouis/COPYING.LESSER
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/liblouis
      - path: Vendor/liblouis/README
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/liblouis
      - path: Vendor/lame/COPYING
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/LAME
      - path: Vendor/lame/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/LAME
      - path: Vendor/foliate-js/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/foliate-js
    settings:
      groups:
        - appVersion
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouth
        TEXTMOUTH_GIT_COMMIT: unknown
        TEXTMOUTH_BUILD_DATE: unknown
        INFOPLIST_FILE: TextMouth/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TextMouth/Resources/TextMouth.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: TextMouth
        GENERATE_INFOPLIST_FILE: false
        # Where Swift finds the LAME module (Vendor/lame/include/module.modulemap),
        # the exception catcher's (Vendor/ObjCExceptionCatcher/include/module.modulemap),
        # and the braille helper's protocol (TextMouthBraille/include/module.modulemap),
        # which the helper's main.c includes too.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/ObjCExceptionCatcher/include $(SRCROOT)/TextMouthBraille/include
      # The Release app, which `make build` packages and `make install`
      # copies, is built to be small. Debug, where the hosted tests run, is
      # left as it is.
      configs:
        Release:
          # Strip the executable's symbol table: the names of its functions
          # and the debug map, about 8 MB that the app never reads. Xcode
          # first writes those debug symbols to TextMouth.app.dSYM, beside
          # the app in the build products, then strips, then signs. A crash
          # report from the stripped app gives each of its frames as an
          # offset in TextMouth, and the dSYM whose UUID matches the app's
          # turns the offsets back into functions, files, and lines (atos,
          # lldb, or Xcode). DEPLOYMENT_POSTPROCESSING has an ordinary build
          # strip, as an archive does; STRIP_STYLE all is Xcode's default for
          # apps, and the dSYM format the Release default, both written here
          # because the stripped app depends on them.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: all
          # Leave out of the link the code and data that nothing in the app
          # can reach, such as the parts of the Swift packages' public API
          # that TextMouth never calls.
          DEAD_CODE_STRIPPING: true
          # Compile the app's own code to be small rather than fastest
          # (-Osize, where Release's default is -O): the app's own code is
          # about 2.4 MB smaller, and the same code computes the same
          # results, only 1% to 11% more slowly (a millisecond or less on
          # each of the ten benchmarks of the November 13, 2026 size audit).
          # The Makefile's build rule gives the Swift packages the same
          # level from the command line, which project.yml cannot do. Debug,
          # where the tests run, is left as it is.
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          # Write no export trie. The stripped executable still carried one,
          # 174 KB naming a single symbol, because strip does not rebuild
          # it. An app's executable exports nothing that anything links
          # against (the braille helper is run, not loaded), so the linker
          # writes none. Release only: in Debug the test bundle loads
          # against the app (BUNDLE_LOADER) and needs its exports.
          # (LD_EXPORT_SYMBOLS is Xcode's own setting for the linker's
          # -no_exported_symbols: Xcode warns when OTHER_LDFLAGS holds it.
          # Scripts/test/release-goldens.sh sets it back to YES.)
          LD_EXPORT_SYMBOLS: NO
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
      - package: swift-markdown
        product: Markdown
      # The MP3 encoder, linked into the app (MP3Encoder).
      - target: LAME
      # The Objective-C exception catcher (ObjCException).
      - target: ObjCExceptionCatcher
      # The braille helper (FMT21), a command-line program copied into
      # Contents/MacOS beside the app's own executable, where
      # Bundle.main.url(forAuxiliaryExecutable:) finds it; never linked.
      - target: TextMouthBraille
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
  # LAME 3.100's MP3 encoder (FR04), vendored in Vendor/lame and built as a
  # static library the app links, so TextMouth writes MP3 itself
  # (MP3Encoder) rather than only through an installed ffmpeg.
  #
  # Vendor/lame holds, unchanged, these files of LAME's release tarball
  # lame-3.100.tar.gz, from https://sourceforge.net/projects/lame/files/lame/3.100/
  # (SHA-256 ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e):
  # COPYING, the GNU Library General Public License, version 2, under which
  # LAME is distributed; LICENSE and README, LAME's notes on using it; the
  # public header include/lame.h; and the encoder's sources and headers in
  # libmp3lame/, the ones LAME's own Makefile builds its library from, less
  # mpglib_interface.c (the decoder's glue, empty without the decoder) and
  # the x86 assembly and SSE routines; only the header declaring the SSE
  # routines, vector/lame_intrin.h, is kept, since fft.c includes it.
  # TextMouth adds two files: config.h, in place of the one LAME's configure
  # script writes, and include/module.modulemap, through which Swift imports
  # lame.h. To update LAME, replace those files from a newer release, compare
  # config.h with the one its configure writes, and run make check.
  #
  # The library is optimized for size in every configuration, as the Release
  # app is: linked into the app it adds about 0.14 MB on Apple silicon, and
  # it encodes speech about 100 times faster than real time. Its compiler
  # warnings are LAME's own and are not shown; the gate counts Swift warnings
  # only. DEBUG stays undefined, as it would turn on LAME's debugging output.
  # Its settings are the LAMELibrary template's, above; LAME_iOS, below, is
  # the same library built for the iOS app.
  LAME:
    templates:
      - LAMELibrary
    platform: macOS
  # One C function that runs a block and returns the Objective-C exception it
  # raised (TMCatchException), for the few framework calls that raise one
  # Swift cannot catch. Built as LAME is: a static library with a module
  # map, which the app links. It is a function, with no class or category
  # for the linker to keep, so the app links it without -ObjC. Its settings
  # are the ObjCExceptionCatcherLibrary template's, above.
  ObjCExceptionCatcher:
    templates:
      - ObjCExceptionCatcherLibrary
    platform: macOS
  # The iOS app's builds of the same two libraries.
  LAME_iOS:
    templates:
      - LAMELibrary
    platform: iOS
    deploymentTarget: "26.0"
  ObjCExceptionCatcher_iOS:
    templates:
      - ObjCExceptionCatcherLibrary
    platform: iOS
    deploymentTarget: "26.0"
  # The iOS app (phase 0 of the port, IOS-PORT-RESEARCH-2026-11-03.md): the
  # same sources as the Mac app, less TextMouth/Platform/macOS/ and the Mac's
  # resources, with TextMouth/Platform/iOS/ for what only iOS compiles. Its
  # module is named TextMouth too, so shared code and tests read the same on
  # both. Xcode builds it only once its iOS platform is downloaded (Xcode >
  # Settings > Components); until then Scripts/ios/typecheck.py checks it.
  # It runs no helper program: iOS lets an app start none.
  TextMouthiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TextMouth
        excludes:
          - "Platform/macOS/**"
          - "Resources/**"
    settings:
      groups:
        - appVersion
      base:
        PRODUCT_NAME: TextMouth
        PRODUCT_MODULE_NAME: TextMouth
        # An identifier of its own: a free team registers it, the background
        # task identifiers must begin with it, and an iOS app running on a
        # Mac would otherwise collide with the Mac app's container and
        # preferences.
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouth.iOS
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: true
        # Merged with the INFOPLIST_KEY_ settings below into the plist Xcode
        # generates. Written from the Mac's plist by
        # Scripts/ios/sync-info-plist.py: the Mac's keys, display name, and
        # document types, less what iOS cannot read, with the keys only iOS
        # needs (the background audio mode, one scene at a time). It holds no
        # key that a setting below also sets, since Apple does not say which
        # would win, and IOSInfoPlistTests checks both.
        INFOPLIST_FILE: TextMouth/Platform/iOS/Info.plist
        # A file from another app arrives where it is, as the Files app holds
        # it, rather than as a copy in Documents/Inbox.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # No INFOPLIST_KEY_UIApplicationSceneManifest_Generation: the scene
        # manifest it writes allows several scenes, and the plist above holds
        # a manifest of one scene at a time instead.
        CODE_SIGN_STYLE: Automatic
        # The LAME, exception-catcher, and braille-protocol modules, as the
        # Mac target finds them.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/ObjCExceptionCatcher/include $(SRCROOT)/TextMouthBraille/include
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
      - package: swift-markdown
        product: Markdown
      - target: LAME_iOS
      - target: ObjCExceptionCatcher_iOS
    # The iPhone app's scheme, committed, so that `xcodebuild test -scheme
    # TextMouthiOS` runs both of its test bundles in the simulator: the one
    # Xcode made by itself held only the UI tests. The Mac's schemes are
    # still Xcode's own, made when none is committed for a target.
    scheme:
      testTargets:
        - TextMouthiOSTests
        - TextMouthiOSUITests
      gatherCoverageData: false
  # liblouis 3.39.0, the braille translator (FMT21), vendored in
  # Vendor/liblouis and built as a static library that only the braille
  # helper links: liblouis is C that reads untrusted braille and text, it has
  # had memory-safety bugs, and it is not thread-safe, so it never runs in
  # TextMouth's own process.
  #
  # Vendor/liblouis holds, unchanged, these files of liblouis's release
  # tarball liblouis-3.39.0.tar.gz, from
  # https://github.com/liblouis/liblouis/releases/tag/v3.39.0 (SHA-256
  # 629fa8cb0dfd9ad457c5bf47a42f0953b673e62c8ad6b1d03ddc4e2bd20008f1, the
  # digest GitHub publishes for it): COPYING.LESSER, the GNU Lesser General
  # Public License, version 2.1, under which the library and its tables are
  # distributed ("or any later version"); README, AUTHORS, and NEWS; the
  # library's sources and headers in liblouis/, the ones its Makefile.am
  # builds liblouis from (liblouis.h.in among them); and in tables/ the four
  # English tables TextMouth offers, with every table they include:
  # Unified English Braille uncontracted (en-ueb-g1.ctb) and contracted
  # (en-ueb-g2.ctb), and English Braille, American Edition, uncontracted
  # (en-us-g1.ctb) and contracted (en_US.tbl), 17 files; and three display
  # tables, which no translation table here includes and only the tests of
  # braille file characters read (BrailleFileCodeTests compares TextMouth's
  # own tables with them, 64 cells of 64): North American Braille ASCII
  # (en-us-brf.dis) and Eurobraille, six-dot, in lowercase (de-eurobrl6.dis)
  # and in capitals (de-eurobrl6u.dis), taken from that same tarball on
  # October 30, 2026, once its SHA-256 matched the one above; 20 files in
  # all. Seven files (lou_translateString.c, lou_backTranslateString.c,
  # compileTranslationTable.c, metadata.c, liblouis.h.in, en-ueb-g2.ctb, and
  # en_US.tbl) were compared with the same files at the v3.39.0 tag (commit
  # 2e775aca674cd2910e272eed7736acceb4c2e4a2) and are identical. Nothing of
  # the release was run: not configure, make, or any script. No code of its
  # tools/ folder, which is GPL 3, is used.
  #
  # TextMouth adds two files: config.h, in place of the one configure
  # writes, and include/liblouis.h, the release's liblouis.h.in with its one
  # substitution made, 32-bit wide characters (UCS-4, as --enable-ucs4
  # makes them), so every Unicode character and braille cell fits. Static
  # linking suits the LGPL here, as it does LAME's licence: the app's whole
  # source, liblouis's included, is in the repository, so the app can be
  # rebuilt with a changed liblouis. To update it, replace those files from
  # a newer release, make include/liblouis.h again from its liblouis.h.in,
  # compare config.h with what the new sources read, and run make check.
  #
  # The library is optimized for size in every configuration, and its
  # compiler warnings are liblouis's own and are not shown; the gate counts
  # Swift warnings only. Its preprocessor definitions are its own, without
  # the DEBUG=1 of the Debug configuration, which would turn on liblouis's
  # debugging output.
  liblouis:
    type: library.static
    platform: macOS
    # C alone, with no Objective-C class or category for the linker to keep.
    requiresObjCLinking: false
    sources:
      - path: Vendor/liblouis/liblouis
        headerVisibility: project
        excludes:
          - liblouis.h.in
      - path: Vendor/liblouis/config.h
        headerVisibility: project
      - path: Vendor/liblouis/include/liblouis.h
        headerVisibility: project
    settings:
      base:
        PRODUCT_NAME: louis
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/liblouis
          - $(SRCROOT)/Vendor/liblouis/include
          - $(SRCROOT)/Vendor/liblouis/liblouis
        GCC_PREPROCESSOR_DEFINITIONS: LIBLOUIS_FOR_TEXTMOUTH=1
        GCC_OPTIMIZATION_LEVEL: s
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        SKIP_INSTALL: YES
        # Its own config.h, never LAME's (see USE_HEADERMAP in LAME's target).
        USE_HEADERMAP: NO
  # The braille helper (FMT21): TextMouthBraille/main.c, TextMouth's own
  # code, a command-line program that links liblouis and translates one
  # book's paragraphs per run, print to braille or braille to print, with
  # the bundle's own tables. The app runs it under its watchdog
  # (BrailleTranslator, through WatchedProcess), so a hang or a crash in
  # liblouis costs one run of the helper, never the app. The app target
  # copies it into Contents/MacOS. Optimized for size, and stripped in the
  # Release configuration as the app is. Its line protocol is defined once,
  # in TextMouthBraille/include/TextMouthBrailleProtocol.h, which main.c
  # includes by its path beside it and the app imports through the module
  # map in the same folder (see SWIFT_INCLUDE_PATHS above), so the two sides
  # cannot disagree about it.
  TextMouthBraille:
    type: tool
    platform: macOS
    sources:
      - path: TextMouthBraille
    dependencies:
      - target: liblouis
    settings:
      base:
        PRODUCT_NAME: TextMouthBraille
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        # liblouis.h is liblouis's own header, as a system header, so the
        # warnings of its comments (five @deprecated commands without a
        # deprecation attribute) are not shown; main.c's own are. Without a
        # header map, which would list it among the project's own headers
        # and find it there first, "liblouis.h" is found on this path.
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Vendor/liblouis/include
        USE_HEADERMAP: NO
        GCC_OPTIMIZATION_LEVEL: s
        SKIP_INSTALL: YES
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: true
  TextMouthProductionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TextMouthProductionTests
      # Production-backed compatibility scenarios still use the original
      # scenario registration syntax while importing the TextMouth module.
      # Keep this list explicit until these grouped activities are rewritten as
      # individual XCTest methods. Every listed file imports the TextMouth module;
      # the copied standalone harness and its implementations have been removed.
      - TextMouthTests/Sources/Tests/OffsetMapTests.swift
      - TextMouthTests/Sources/Tests/TextSubstitutionTests.swift
      - TextMouthTests/Sources/Tests/ParserEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/BookmarkToggleTests.swift
      - TextMouthTests/Sources/Tests/KeyboardShortcutTests.swift
      - TextMouthTests/Sources/Tests/DOCXParserTests.swift
      - TextMouthTests/Sources/Tests/DOCXEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/EPUBParserTests.swift
      - TextMouthTests/Sources/Tests/DAISYParserTests.swift
      - TextMouthTests/Sources/Tests/DAISYEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/DAISYAudioTests.swift
      - TextMouthTests/Sources/Tests/MenuVisibilityTests.swift
      - TextMouthTests/Sources/Tests/IntegrationTests.swift
      - TextMouthTests/Sources/Tests/BugRegressionTests.swift
      - TextMouthTests/Sources/Tests/FolderNavigationHistoryTests.swift
      - TextMouthTests/Sources/Tests/FolderSortSettingTests.swift
      - TextMouthTests/Sources/Tests/ManualOrderTests.swift
      - TextMouthTests/Sources/Tests/OrphanAdoptionTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthProductionTests
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: TextMouthProductionTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TextMouth.app/Contents/MacOS/TextMouth"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The LAME, exception-catcher, and braille-protocol modules, which `@testable import TextMouth` may load.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/ObjCExceptionCatcher/include $(SRCROOT)/TextMouthBraille/include
    dependencies:
      - target: TextMouth
  # The iPhone app's own tests, run in the iOS simulator by
  # `xcodebuild test -scheme TextMouthiOS`: what only iOS compiles, the UIKit
  # code under TextMouth/Platform/iOS/ that the Mac's test host never sees.
  # Hosted in the iPhone app, so `@testable import TextMouth` reaches its
  # types, and TextMouthRuntime gives the hosting process a sandboxed library
  # of its own, as on the Mac. The plain types in TextMouth/Phone/ stay tested
  # on the Mac's host, with the rest of the suite.
  TextMouthiOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TextMouthiOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthiOSTests
        GENERATE_INFOPLIST_FILE: true
        # Both apps' products are TextMouth.app, and the scheme Xcode made for
        # the iPhone app by itself left this bundle out of its tests: the
        # iPhone app's own scheme, in the TextMouthiOS target, names it.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TextMouth.app/TextMouth"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # The LAME, exception-catcher, and braille-protocol modules, which `@testable import TextMouth` may load.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/lame/include $(SRCROOT)/Vendor/ObjCExceptionCatcher/include $(SRCROOT)/TextMouthBraille/include
    dependencies:
      - target: TextMouthiOS
  # The iPhone app driven from outside, in the simulator, by XCUITest: what
  # VoiceOver would be given on the Library and the reader (each element's
  # label, value, and traits, and their order), and Apple's accessibility
  # audit of each screen. Each test launches the app with a library of its
  # own and a public-domain book sent to it (PhoneLaunchRequest). A test that
  # presses Play or types makes sound, so it runs only where
  # TEXTMOUTH_UI_SOUND is 1, which the GitHub runner's script sets and nothing
  # on the development Mac does (TextMouthUITestCase.requireSound).
  TextMouthiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - TextMouthiOSUITests
      # Alice's Adventures in Wonderland, Project Gutenberg #11, the sample
      # the Mac's tests read too: the book each UI test sends the app.
      - path: TestData/alice.epub
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthiOSUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TextMouthiOS
    dependencies:
      - target: TextMouthiOS
