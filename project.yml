name: TextMouth
options:
  bundleIdPrefix: com.textmouth
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.30"

# Swift package versions are locked deliberately. Each direct dependency is
# an exactVersion requirement, so regenerating the project can never float to
# an untested release, and the committed Package.resolved under
# TextMouth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/ pins exact
# revisions plus the transitive swift-cmark package. `make check` fails when
# resolution would change that file. To upgrade a package, change its version
# here, run `make update-packages`, review the Package.resolved diff, run
# `make check`, and commit both files together.
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: "2.13.9"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: "0.9.0"

# Every target compiles in the Swift 6 language mode and checks Swift
# concurrency completely, so Xcode, make build, make test, make check, and CI
# all report the same diagnostics. Both are set here, for the whole project,
# overriding XcodeGen's Swift 5 default, so a target added later inherits
# them too; no target may lower them. In the Swift 6 mode a data race the
# compiler can find is an error rather than a warning, and synchronous
# main-actor code that a framework calls on another thread stops at a runtime
# check instead of racing. SWIFT_STRICT_CONCURRENCY repeats what the Swift 6
# mode implies, and stays as the setting the build commands and documentation
# name. The build is free of warnings, and `make check` fails on any Swift
# warning (Scripts/check.sh), so a new concurrency problem is reported the
# day it is written. Package targets are not affected: Xcode builds them with
# their own settings and suppresses their warnings.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  TextMouth:
    type: application
    platform: macOS
    sources:
      - TextMouth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouth
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "1"
        TEXTMOUTH_GIT_COMMIT: unknown
        TEXTMOUTH_BUILD_DATE: unknown
        INFOPLIST_FILE: TextMouth/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TextMouth/Resources/TextMouth.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: TextMouth
        GENERATE_INFOPLIST_FILE: false
      # The Release app, which `make build` packages and `make install`
      # copies, is built to be small. Debug, where the hosted tests run, is
      # left as it is.
      configs:
        Release:
          # Strip the executable's symbol table: the names of its functions
          # and the debug map, about 8 MB that the app never reads. Xcode
          # first writes those debug symbols to TextMouth.app.dSYM, beside
          # the app in the build products, then strips, then signs. A crash
          # report from the stripped app gives each of its frames as an
          # offset in TextMouth, and the dSYM whose UUID matches the app's
          # turns the offsets back into functions, files, and lines (atos,
          # lldb, or Xcode). DEPLOYMENT_POSTPROCESSING has an ordinary build
          # strip, as an archive does; STRIP_STYLE all is Xcode's default for
          # apps, and the dSYM format the Release default, both written here
          # because the stripped app depends on them.
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: all
          # Leave out of the link the code and data that nothing in the app
          # can reach, such as the parts of the Swift packages' public API
          # that TextMouth never calls.
          DEAD_CODE_STRIPPING: true
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
      - package: swift-markdown
        product: Markdown
  TextMouthProductionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TextMouthProductionTests
      # Production-backed compatibility scenarios still use the original
      # scenario registration syntax while importing the TextMouth module.
      # Keep this list explicit until these grouped activities are rewritten as
      # individual XCTest methods. Every listed file imports the TextMouth module;
      # the copied standalone harness and its implementations have been removed.
      - TextMouthTests/Sources/Tests/OffsetMapTests.swift
      - TextMouthTests/Sources/Tests/TextSubstitutionTests.swift
      - TextMouthTests/Sources/Tests/ParserEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/BookmarkToggleTests.swift
      - TextMouthTests/Sources/Tests/KeyboardShortcutTests.swift
      - TextMouthTests/Sources/Tests/DOCXParserTests.swift
      - TextMouthTests/Sources/Tests/DOCXEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/EPUBParserTests.swift
      - TextMouthTests/Sources/Tests/DAISYParserTests.swift
      - TextMouthTests/Sources/Tests/DAISYEdgeCaseTests.swift
      - TextMouthTests/Sources/Tests/DAISYAudioTests.swift
      - TextMouthTests/Sources/Tests/MenuVisibilityTests.swift
      - TextMouthTests/Sources/Tests/IntegrationTests.swift
      - TextMouthTests/Sources/Tests/BugRegressionTests.swift
      - TextMouthTests/Sources/Tests/FolderNavigationHistoryTests.swift
      - TextMouthTests/Sources/Tests/FolderSortSettingTests.swift
      - TextMouthTests/Sources/Tests/ManualOrderTests.swift
      - TextMouthTests/Sources/Tests/OrphanAdoptionTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.textmouth.TextMouthProductionTests
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: TextMouthProductionTests/Info.plist
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TextMouth.app/Contents/MacOS/TextMouth"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: TextMouth
