# Reproducibility gate for TextMouth.
#
# For every push to main and every pull request it checks, in two sets of jobs that run side by side:
#
# - `gate` runs `make check --without-tests` (Scripts/check.sh): regenerate the Xcode project, resolve
#   Swift packages exactly as the committed Package.resolved pins them, and build Release from scratch,
#   failing on any generation, resolution, or compile error, on any Swift warning, and on an app larger
#   than its size limit.
# - `suite` runs the hosted XCTest suite through tests.yml, the workflow that test-build.yml calls for
#   a push to TestBuild, so the suite has one way to run on GitHub: in parallel shards. It asks for what
#   the old fourth step asked: a build from nothing, since xcodebuild reports a file's warnings only when it
#   compiles that file, and no Swift warning allowed in it. One machine ran the whole suite in more than the
#   old job's 60-minute limit; the shards finish it in about 20 minutes cold.
#   It runs only for a push to main and for a pull request from this repository, not from a fork: it starts
#   5 macOS jobs (the gate and 4 shards), and GitHub runs 5 at once, so a fork's pull request could keep
#   TestBuild's runs waiting. A fork's pull request still gets the gate.
#
# What the suite is not, compared with the fourth step of `make check` (Scripts/check.sh) on a Mac:
# - The 103 tests of Scripts/agents/runner-skips.conf are left out, as they are on TestBuild, so no job on
#   GitHub runs them; the development Mac does (`make check` runs them all).
# - Two families of timing tests (KF8HostileFileTests, MOBIHostileFileTests) have their limits multiplied
#   by 2.5 (TestMachine.timeScale; Scripts/agents/run-on-runner.py sets it).
# - xcodebuild here is not given -onlyUsePackageVersionsFromResolvedFile, as `make test` is on a Mac, so the
#   pins are checked on the gate's machine only (step 2 and the end of `make check --without-tests`).
# - "strict_performance" asks for the performance baselines to run even on a busy machine, but they run
#   only on the Mac model they were recorded on (PerformanceBaselineSupport): on a GitHub runner they are
#   skipped, as they were in the old job, so no baseline is checked here. Run `make check` on the development
#   Mac for that.
#
# The toolchain (Xcode and XcodeGen, with the digest GitHub publishes for XcodeGen) is pinned in one place,
# the local action .github/actions/setup-xcode, which every macOS job here and in tests.yml uses.
# Actions are pinned to full commit hashes, with their release tags alongside.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gate only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its running check; every push to
# main is checked to completion. (This group is not the one of test-build.yml, so a check
# never cancels a run on TestBuild.)
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: make check (without the suite)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode and XcodeGen
        uses: ./.github/actions/setup-xcode

      # The gate's own tests take seconds and need no build tools, so a broken
      # gate fails before the long build starts.
      - name: Test the gate script
        run: make check-selftest

      # Swift package repositories (shared SwiftPM cache) and the checkouts
      # that make resolve-packages and make build share. The key changes
      # whenever a pin or the Xcode version does.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-26.0.1-${{ hashFiles('TextMouth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run the gate
        run: make check CHECK_ARGS=--without-tests

      - name: Upload the gate's logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/check/
            build/xcodebuild-Release.log
          if-no-files-found: ignore
          retention-days: 14

  suite:
    name: the hosted suite
    # Not for a pull request from a fork (see the top of this file).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/tests.yml
    with:
      # The full suite in the most shards, built from nothing, no Swift warning, and no iPhone build
      # (test-build.yml's runs build that). Strict baselines are asked for and skipped on a runner (see above).
      # requests/head are left out: no train reads this.
      request-json: '{"areas":["all"],"classes":[],"full":true,"shards":4,"cold":true,"ios":false,"strict_performance":true,"no_warnings":true}'
