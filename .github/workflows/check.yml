# Reproducibility gate for TextMouth.
#
# Runs `make check` for every push to main and every pull request: regenerate
# the Xcode project, resolve Swift packages exactly as the committed
# Package.resolved pins them, build Release, and run the hosted XCTest suite.
# The job fails on any generation, resolution, compile, or test error, and on
# any Swift warning in either build, and uploads the gate's logs when it fails
# or times out.
#
# The toolchain matches the development Mac, and changes only deliberately:
# - XCODE_VERSION is what `xcodebuild -version` reports there (26.0.1, build
#   17A400). The macos-26 image installs it beside a newer default, so the
#   job selects it through DEVELOPER_DIR, which xcode-select(1) documents as
#   the per-process override of the active developer directory.
# - XCODEGEN_VERSION is the development Mac's XcodeGen, and XCODEGEN_SHA256 is
#   the digest GitHub publishes for that release's xcodegen.zip.
# Actions are pinned to full commit hashes, with their release tags alongside.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gate only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its running check; every push to
# main is checked to completion.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODE_VERSION: "26.0.1"
      XCODEGEN_VERSION: "2.45.3"
      XCODEGEN_SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every later step's xcodebuild, xcrun, and swift use this Xcode.
      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          developer_dir="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [ ! -d "$developer_dir" ]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed on this runner image. Choose a new version deliberately and update XCODE_VERSION."
            exit 1
          fi
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          sw_vers

      # The gate's own tests take seconds and need no build tools, so a broken
      # gate fails before the long build starts.
      - name: Test the gate script
        run: make check-selftest

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      # Swift package repositories (shared SwiftPM cache) and the checkouts
      # that make resolve-packages and make build share. The key changes
      # whenever a pin or the Xcode version does.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('TextMouth.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run the gate
        run: make check

      - name: Upload the gate's logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/check/
            build/xcodebuild-Release.log
          if-no-files-found: ignore
          retention-days: 14
