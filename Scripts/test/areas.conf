# areas.conf: the test areas of the hosted suite, read by run-area.py.
#
# An area is a named group of hosted test classes (the classes of
# TextMouthProductionTests), so one command can run just the tests of one part
# of the app: `Scripts/test/run-area.py feeds bookmarks`.
#
# Format:
#   * `#` starts a comment, on its own line or after a class name.
#   * `[name] one-line description` starts an area. The name is lowercase
#     letters, digits and hyphens. The name `all` is built in (every class any
#     area lists) and cannot be used.
#   * Every other non-blank line is one test class name, belonging to the last
#     area. A class may be listed in two areas, but not twice in one.
#   * Every listed class must exist in the sources and have tests:
#     `run-area.py --selftest` checks it, and `run-area.py --unassigned` lists
#     the test classes that no area names.
#
# Every runnable hosted test class is in at least one area (and in at most
# two): `run-area.py --unassigned` prints "0 unassigned" when that holds.
# Classes are sorted inside each area.

