# Tests the GitHub runner leaves out (Scripts/agents/run-on-runner.py reads this file).
#
# One "Class.testName  # reason" per line. Each hung on the runner, which lacks a working audio path
# (AudioQueue fails to start, error -4), or failed there for a reason of the runner, though it passes on the
# development Mac. They are found by running the suite on the runner and reading which tests the host was
# restarted in; a run's summary says how many were left out. The Mac's own full suite still runs them, so a
# remote suite is no replacement for one run here before a release (docs/developer/testing.md, Tests on
# GitHub Actions). Sorted by class.

