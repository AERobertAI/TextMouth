# What the GitHub runner does not run (Scripts/agents/run-on-runner.py reads this file).
#
# One "Class.testName  # reason" per line, or "Class  # reason" for a whole class. An entry is here only when the
# runner cannot run the test: it hangs the test host there (the machine has no audio output path that starts), or
# it needs something a virtual machine does not have. Each reason says which, and every test still runs on the
# development Mac. A test that failed once with a timing the runner may have caused is NOT here: it is listed as
# flaky in docs/developer/testing.md (Tests on GitHub Actions). Nobody raises a test's own time limit to make
# it pass on the runner. A run's summary says how many entries were left out, and a remote result tells an agent
# which of the tests it asked for are here ("Not run on GitHub, no verdict").
#
# The entries are the tests that hung or failed in the runs' logs, named one by one. On November 10, 2026 the list was
# pruned by a probe: every class that had an entry ran with none of the skips (a request with "no_skips": true, sent by
# hand), and the entries whose tests passed were dropped (two of them, which failed in the next full run, were put back), among them the whole PodcastChaptersHeadingsTests class and
# tests that had hung only because the speech-voice listing was holding every thread of the app's concurrency pool
# (VoiceCatalog, fixed that day). What is left hung or failed in the probe. Two audio-reading classes, ReaderAudioFailureTests
# and the Recording* ones, were not reached by the probe (its shard was stopped by its limit), and the Ogg tests were not probed
# on purpose (nothing decodes Ogg through Apple's frameworks), so their entries stand. To run these on this Mac, use a local
# `python3 -I Scripts/agents/build-train.py run` (without --remote), which takes the heavy-work lock.

